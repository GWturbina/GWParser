# Сборка установщика GWParser_Setup.exe (12.10.2026).
# Запуск: вкладка Actions -> «Собрать установщик» -> Run workflow.
# Нужны секреты репозитория (Settings -> Secrets and variables -> Actions):
#   TG_API_ID   - число api_id клубного приложения с my.telegram.org
#   TG_API_HASH - строка api_hash оттуда же
# Готовый установщик появляется в Releases, ссылка для сайта всегда одна:
#   https://github.com/<владелец>/GWParser/releases/latest/download/GWParser_Setup.exe
name: Собрать установщик

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Библиотеки
        run: |
          python -m pip install --upgrade pip
          python -m pip install telethon==1.45.0 requests==2.32.3 qrcode==8.2 pyinstaller==6.11.1

      - name: Клубные ключи Telegram из секретов
        shell: pwsh
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if (-not $env:TG_API_ID -or -not $env:TG_API_HASH) {
            Write-Error "Не заданы секреты TG_API_ID и TG_API_HASH (Settings -> Secrets and variables -> Actions)"
            exit 1
          }
          $id = ($env:TG_API_ID -replace '\D','')
          $hash = ($env:TG_API_HASH -replace '[^0-9a-fA-F]','')
          Set-Content -Path _club_keys.py -Encoding utf8 -Value "API_ID = $id`nAPI_HASH = '$hash'"

      - name: Программа GWParser.exe
        run: pyinstaller --noconfirm --onefile --console --name GWParser --icon poisk.ico --add-data "config.ini;." --hidden-import _club_keys --collect-submodules qrcode gw_parser.py

      - name: Установщик GWParser_Setup.exe
        shell: pwsh
        env:
          APP_VERSION: 3.2.${{ github.run_number }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.${{ github.run_number }}
          name: Поиск контактов 3.2.${{ github.run_number }}
          make_latest: true
          files: dist/GWParser_Setup.exe
          body: Установщик программы «Поиск контактов» для Windows. Скачать, запустить, «Установить».
