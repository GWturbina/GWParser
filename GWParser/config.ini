; ==========================================================================
; НАСТРОЙКИ СБОРЩИКА GW PARSER v3.0 - ВСЕ НАПРАВЛЕНИЯ
; Версия 06.10.2026: все направления, автопоиск групп, папки GWay, живой режим.
; (13.09.2026: пустые чаты убраны, добавлены подсказки по областям.)
; ЗАПОЛНИТЕ: api_id и api_hash (ваши, с my.telegram.org). Ключ парсера
; не нужен - вход кошельком клуба (SafePal), программа откроет страницу сама. Список чатов - ваши чаты, куда вы вступили.
; ==========================================================================

[parser]

; --- 1. Ключи с my.telegram.org (РАБОЧИЙ аккаунт) --------------------------
api_id =
api_hash =

; --- 2. Вход (v3.0) -----------------------------------------------------
; Ключ НЕ нужен: при первом запуске программа откроет страницу входа
; кошельком клуба (SafePal). Строку parser_key оставьте ПУСТОЙ.
parser_key =

; --- 3. Куда шлём (менять не нужно) ---------------------------------------
server = https://cgift.club/api/assistant

; --- 4. Что собираем ------------------------------------------------------
; directions = all  - все направления клуба (так и оставьте).
; Можно перечислить только нужные через запятую:
;   job          GlobalWay - работа          team   GlobalWay - команда
;   debt         GlobalWay - долги           tools  GlobalWay - клиенты для дела
;   hc_consult   Здоровье - совет врача      hc_wellness  Здоровье - образ жизни
;   m2_house     Метр² - жильё               m2_refugee   Метр² - переселенцы
;   m2_nature    Метр² - жить на природе     m2_business  Метр² - своё дело
;   jewelry      Diamond - украшения
directions = all
; страна по умолчанию - для чатов, у которых страна не указана (обычно пусто)
region =
; строка direction осталась от версии 1.5 и больше не используется
direction = job

; --- 4а. Где искать (v2.1) -------------------------------------------------
; v2.4: имя пакета - печатается при запуске, чтобы было видно, какой он
package = 
; v2.4: countries - страны для автопоиска (через запятую). Пусто - вся часть
;   света из строки regions. Пример: countries = Германия, Австрия
countries = 
; regions - части света для автопоиска и папок: Европа, Азия, Америка, Остальные
;   all = все. ВПИШИТЕ свою часть света - её назначил Автор клуба:
regions = all
; Автопоиск: программа сама ищет публичные группы по городам и читает их
; БЕЗ вступления. on - включён, off - выключен (тогда только chats и папки).
auto_search = on
; Сколько поисков групп за один запуск (не больше 30). Между поисками пауза
; 10-18 секунд, чтобы Telegram не ограничил аккаунт. 15 - безопасно.
search_per_run = 15
; Сколько найденных групп читать за один запуск (не больше 60). Сначала те,
; что уже давали людей. Группы, 3 раза подряд пустые, программа бросает сама.
groups_per_run = 40
; Папки Telegram, которые читаются сами: их название начинается с этого слова.
; Создайте в Telegram папки «GWay Европа», «GWay Азия», «GWay Америка»,
; «GWay Остальные» и кладите туда хорошие чаты - в этот файл их вписывать не надо.
folder_prefix = GWay

; --- 4б. Живой режим (v2.2) - запуск файлом Zhivoy_rezhim.bat ------------
; Программа не закрывается и каждые live_minutes минут проверяет чаты.
; Найденных людей СРАЗУ присылает в Telegram с готовым первым сообщением.
live_minutes = 20
; Кому слать уведомления: me = «Избранное» рабочего аккаунта.
; Можно указать свой личный аккаунт:  notify_to = @ваш_ник
; (личный аккаунт должен один раз написать рабочему любое слово).
notify_to = me
; on - найденные люди уходят и в копилку клуба (их получат партнёры),
; off - только вам, в копилку не идут.
live_to_pool = on

; --- 5. Насколько глубоко читать -----------------------------------------
hours_back = 26
max_per_chat = 60

; --- 6. Чаты ---------------------------------------------------------------
; v2.0: после имени чата через черту - страна:   rabota_lviv | Украина
; Тогда люди из чата попадут в копилку этой страны, и их получит партнёр,
; который в «Поиске клиентов» выбрал эту страну. Страны пишите словом:
; Украина, Польша, Германия, Чехия, Израиль, Казахстан, Молдова, Грузия...
; Без страны люди попадут в общую копилку «мир».
;
; Один чат даёт людей во ВСЕ направления сразу: в чате «Работа Ужгород»
; кто-то ищет работу, кто-то квартиру, кто-то врача - парсер разложит сам.
; Поэтому полезны и чаты переселенцев, мам, города, диаспоры - не только работа.
; Убраны как пустые после трёх заходов:
;   ruwiw, workinpolandi, helpUkraine_Gemany, tut_marketingseodigital, svalyavavpo
;
; Большие польские каналы оставлены в самом низу: они съедают лимит
; просмотра и почти ничего не дают. Если и дальше будут пустыми - уберите.
;
; Лучший улов дали местные украиноязычные чаты - их и надо добирать.
; Ищите в поиске Telegram по образцу "робота Вінниця", "шукаю роботу Львів",
; "вакансії Полтава" и вступайте НЕ БОЛЬШЕ ЧЕМ В 10 ЧАТОВ В ДЕНЬ -
; иначе Telegram ограничит аккаунт.

chats =
;  ── впишите свои чаты, по одному в строке, с отступом 4 пробела ──
;  Пример:
;    rabota_lviv | Украина
;    praca_warszawa | Польша
